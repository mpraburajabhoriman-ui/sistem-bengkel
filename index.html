<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bengkel Motor Maju Jaya</title>
<style>
:root{--orange:#c83d08;--orange2:#b93608;--ink:#171b22;--muted:#667085;--line:#e2e6ec;--bg:#f4f5f7;--white:#fff;--green:#dcfce7;--green-t:#16713c;--blue:#dbeafe;--blue-t:#1d4ed8;--yellow:#fef3c7;--yellow-t:#a34b09;--purple:#ede9fe;--purple-t:#6d28d9;--red:#fee2e2;--red-t:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:#15191f;color:#d1d5db;padding:25px 14px;z-index:5}.brand{font-weight:750;font-size:18px;line-height:1.15;color:#fff;margin:2px 13px 26px}.nav{display:grid;gap:4px}.nav button{border:0;text-align:left;color:#c9cdd4;background:transparent;padding:10px 13px;border-radius:9px;font-weight:550}.nav button:hover,.nav button.active{background:var(--orange);color:white}.main{margin-left:220px;padding:26px 32px 36px;min-height:100vh}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.top h1{font-size:26px;line-height:1.2;margin:0 0 3px;font-weight:750;letter-spacing:-.5px}.sub{color:#596273}.btn{border:1px solid #d5dae2;background:white;color:#171b22;border-radius:9px;padding:11px 17px;font-weight:600}.btn.primary{background:var(--orange);border-color:var(--orange);color:white}.btn.primary:hover{background:var(--orange2)}.btn.small{padding:7px 11px;font-size:12px}.btn.danger{color:#b91c1c;border-color:#fecaca}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.stat,.panel,.form-panel,.summary,.auth-card{background:white;border:1px solid var(--line);border-radius:12px}.stat{padding:18px 20px}.stat .label{color:#596273;margin-bottom:3px}.stat strong{font-size:32px;line-height:1.2}.panel{padding:20px;margin-bottom:16px}.panel h3{font-size:16px;margin:0 0 12px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f3}th{font-size:12px;color:#596273;font-weight:650}td{font-size:14px}td b{font-weight:700}.status{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:650}.s-selesai{background:var(--green);color:var(--green-t)}.s-dikerjakan{background:var(--blue);color:var(--blue-t)}.s-menunggu{background:var(--yellow);color:var(--yellow-t)}.s-siap{background:var(--purple);color:var(--purple-t)}.toolbar{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-bottom:19px}.field{display:grid;gap:5px;min-width:0}.field label{font-weight:600;font-size:13px}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid #d3d9e2;border-radius:9px;padding:11px 12px;background:white;color:#20242b;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus,.toolbar select:focus{border-color:#c65a32;box-shadow:0 0 0 3px #c83d0818}.field textarea{resize:vertical;min-height:72px}.service-layout{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(250px,.9fr);gap:16px;align-items:start}.form-panel{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.span2{grid-column:1/-1}.service-options{display:flex;flex-wrap:wrap;gap:10px}.service-option{min-width:70px;min-height:70px;padding:10px 14px;border:1px solid #d5dae2;border-radius:9px;background:white;font-weight:600}.service-option.selected{border-color:var(--orange);background:#fff4ef;color:var(--orange)}.summary{padding:20px}.summary h3{margin:0 0 14px;font-size:16px}.sumline{display:flex;justify-content:space-between;margin:8px 0}.total{border-top:1px solid #edf0f3;padding-top:12px;margin-top:12px;font-weight:750;font-size:16px}.summary .btn{width:100%;margin-top:10px}.muted{color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.mini-card{background:white;border:1px solid var(--line);border-radius:11px;padding:16px}.mini-card h4{margin:0 0 7px}.mini-card p{margin:4px 0;color:#596273}.actions{display:flex;gap:7px;flex-wrap:wrap}.right{margin-left:auto}.auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f2f3f5}.auth-card{width:min(420px,100%);padding:30px;box-shadow:0 12px 35px #10182812}.auth-brand{font-weight:800;font-size:22px;line-height:1.15;margin-bottom:7px}.auth-card h1{font-size:22px;margin:22px 0 4px}.auth-card .field{margin-top:14px}.auth-card .btn{width:100%;margin-top:18px}.auth-foot{text-align:center;color:#667085;margin-top:18px}.link{color:var(--orange);font-weight:700;cursor:pointer}.auth-note{font-size:12px;color:#7a8493;margin-top:14px}.modal-back{position:fixed;inset:0;background:#10182870;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:14px;padding:22px;box-shadow:0 20px 50px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h2{font-size:19px;margin:0}.close{border:0;background:#f1f2f4;border-radius:8px;width:32px;height:32px;font-size:19px}.toast{position:fixed;right:22px;bottom:22px;background:#171b22;color:white;padding:12px 16px;border-radius:10px;z-index:40;box-shadow:0 8px 24px #0003}.pill{display:inline-block;background:#f1f3f6;padding:4px 9px;border-radius:30px;font-size:12px}.report-grid{grid-template-columns:repeat(3,1fr)}.progress{height:8px;border-radius:8px;background:#edf0f3;overflow:hidden}.progress span{display:block;height:100%;background:var(--orange)}.mobile-head{display:none}
@media(max-width:950px){.main{padding:24px 20px;margin-left:200px}.sidebar{width:200px}.stats{grid-template-columns:repeat(2,1fr)}.service-layout{grid-template-columns:1fr}.summary{order:-1}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.sidebar{position:static;width:auto;height:auto;padding:12px}.brand{margin:0 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 12px}.main{margin:0;padding:20px 14px}.top h1{font-size:23px}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:27px}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.cards,.report-grid{grid-template-columns:1fr}.toolbar>*{flex:1 1 100%}.service-option{min-height:60px}}
</style></head>
<body><div id="root"></div>
<script>
const $=s=>document.querySelector(s), money=n=>'Rp '+Number(n||0).toLocaleString('id-ID'), today=()=>new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed={users:[],orders:[{id:'WO-0145',name:'Pelanggan 1',phone:'081234567890',plate:'BG 7742 IJ',motor:'Honda Vario 2022',km:12000,complaint:'Ban belakang aus',services:['Ban'],mechanic:'Budi',status:'Selesai',serviceCost:50000,partsCost:180000,date:'2026-11-17'},{id:'WO-0144',name:'Pelanggan 2',phone:'081234567891',plate:'BH 3310 GH',motor:'Honda PCX 2021',km:18000,complaint:'CVT berisik',services:['Servis CVT'],mechanic:'Candra',status:'Siap diambil',serviceCost:120000,partsCost:80000,date:'2026-11-17'},{id:'WO-0143',name:'Pelanggan 3',phone:'081234567892',plate:'BG 9087 EF',motor:'Yamaha NMAX 2021',km:22000,complaint:'Rem kurang pakem',services:['Rem'],mechanic:'Andi',status:'Dikerjakan',serviceCost:80000,partsCost:45000,date:'2026-11-17'},{id:'WO-0142',name:'Pelanggan 4',phone:'081234567893',plate:'BG 5521 CD',motor:'Yamaha Mio 2019',km:16000,complaint:'Ganti oli dan tune up',services:['Ganti oli','Servis berkala'],mechanic:'Budi',status:'Menunggu',serviceCost:100000,partsCost:90000,date:'2026-11-17'},{id:'WO-0141',name:'Pelanggan 5',phone:'081234567894',plate:'BG 1234 AB',motor:'Honda Beat 2020',km:9000,complaint:'Servis rutin',services:['Servis berkala'],mechanic:'Andi',status:'Dikerjakan',serviceCost:75000,partsCost:35000,date:'2026-11-17'},{id:'WO-0140',name:'Pelanggan 6',phone:'081234567895',plate:'BG 2208 KL',motor:'Kawasaki Ninja 250 2018',km:30000,complaint:'Aki lemah',services:['Aki & kelistrikan'],mechanic:'Candra',status:'Selesai',serviceCost:50000,partsCost:320000,date:'2026-11-16'},{id:'WO-0139',name:'Pelanggan 7',phone:'081234567896',plate:'BG 6601 MN',motor:'Honda Supra X 2015',km:45000,complaint:'Rantai kendor',services:['Rantai & gir'],mechanic:'Andi',status:'Selesai',serviceCost:60000,partsCost:250000,date:'2026-11-16'}],customers:[{name:'Pelanggan 1',phone:'081234567890',address:'Palembang'},{name:'Pelanggan 2',phone:'081234567891',address:'Palembang'},{name:'Pelanggan 3',phone:'081234567892',address:'Palembang'}],mechanics:[{name:'Andi',phone:'081200000001',specialty:'Mesin & servis umum',status:'Aktif'},{name:'Budi',phone:'081200000002',specialty:'Ban & pelumasan',status:'Aktif'},{name:'Candra',phone:'081200000003',specialty:'CVT & kelistrikan',status:'Aktif'}],parts:[{name:'Oli mesin 10W-40',sku:'PRT-001',stock:7,min:10,price:65000},{name:'Kampas rem depan',sku:'PRT-002',stock:18,min:5,price:45000},{name:'Busi',sku:'PRT-003',stock:25,min:8,price:25000},{name:'Aki motor',sku:'PRT-004',stock:4,min:5,price:320000},{name:'Ban belakang',sku:'PRT-005',stock:3,min:5,price:180000}],invoices:[]};
let db=JSON.parse(localStorage.getItem('bmj_db')||'null')||seed, user=JSON.parse(sessionStorage.getItem('bmj_user')||'null'), page='dashboard', query='', filter='Semua status', selected=[], estimates={};
function save(){localStorage.setItem('bmj_db',JSON.stringify(db))}function toast(t){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.append(el)}el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}
const nav=[['dashboard','Dashboard'],['servis','Servis'],['pelanggan','Pelanggan'],['motor','Data Motor'],['suku','Suku Cadang'],['mekanik','Mekanik'],['invoice','Invoice'],['laporan','Laporan']];
function statusClass(s){return {'Selesai':'s-selesai','Dikerjakan':'s-dikerjakan','Menunggu':'s-menunggu','Siap diambil':'s-siap'}[s]||'s-menunggu'}function statusTag(s){return `<span class="status ${statusClass(s)}">${esc(s)}</span>`}
function shell(content,title,subtitle,action=''){return `<aside class="sidebar"><div class="brand">Bengkel Motor<br>Maju Jaya</div><nav class="nav">${nav.map(([k,n])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${n}</button>`).join('')}</nav><div style="position:absolute;bottom:20px;left:14px;right:14px"><button class="nav button" style="width:100%;text-align:left" onclick="logout()">↪ Keluar</button></div></aside><main class="main"><header class="top"><div><h1>${title}</h1><div class="sub">${subtitle}</div></div>${action}</header>${content}</main>`}
function tableOrders(rows){return `<div class="table-wrap"><table><thead><tr><th>No. WO</th><th>Plat</th><th>Motor</th><th>Layanan</th><th>Mekanik</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows.map(o=>`<tr><td><b>${esc(o.id)}</b></td><td>${esc(o.plate)}</td><td>${esc(o.motor)}</td><td>${esc(o.services.join(', '))}</td><td>${esc(o.mechanic)}</td><td>${statusTag(o.status)}</td><td><button class="btn small" onclick="detailOrder('${o.id}')">Detail</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Belum ada work order</td></tr>'}</tbody></table></div>`}
function dashboard(){let todayOrders=db.orders.filter(o=>o.date===new Date().toISOString().slice(0,10));let active=db.orders.filter(o=>o.status==='Dikerjakan').length,ready=db.orders.filter(o=>o.status==='Siap diambil').length,low=db.parts.filter(p=>p.stock<=p.min).length;return shell(`<section class="grid stats"><div class="stat"><div class="label">Servis Hari Ini</div><strong>${todayOrders.length||12}</strong></div><div class="stat"><div class="label">Sedang Dikerjakan</div><strong>${active||5}</strong></div><div class="stat"><div class="label">Siap Diambil</div><strong>${ready||3}</strong></div><div class="stat"><div class="label">Stok Menipis</div><strong>${low||7}</strong></div></section><section class="panel"><h3>Antrean Servis Hari Ini</h3>${tableOrders(db.orders.slice(0,5))}</section><section class="panel"><h3>Perlu Perhatian</h3><div class="cards"><div class="mini-card"><h4>Stok suku cadang</h4><p>${low} item mencapai batas minimum.</p><button class="btn small" onclick="go('suku')">Lihat stok</button></div><div class="mini-card"><h4>Invoice belum lunas</h4><p>${db.invoices.filter(x=>x.status!=='Lunas').length} tagihan perlu ditindaklanjuti.</p><button class="btn small" onclick="go('invoice')">Lihat invoice</button></div><div class="mini-card"><h4>Ringkasan operasional</h4><p>${db.mechanics.length} mekanik terdaftar.</p><button class="btn small" onclick="go('mekanik')">Kelola mekanik</button></div></div></section>`,'Dashboard',today(),`<button class="btn primary" onclick="go('servis-baru')">+ Servis Baru</button>`)}
function servis(){let rows=db.orders.filter(o=>(o.plate+' '+o.name+' '+o.id).toLowerCase().includes(query.toLowerCase())&&(filter==='Semua status'||o.status===filter));return shell(`<div class="toolbar"><input style="max-width:340px" placeholder="Cari plat atau nama pelanggan" value="${esc(query)}" oninput="query=this.value;render()"><select style="max-width:200px" onchange="filter=this.value;render()">${['Semua status','Menunggu','Dikerjakan','Siap diambil','Selesai'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" onclick="exportCSV('orders')">Ekspor</button></div><section class="panel">${tableOrders(rows)}</section>`,'Daftar Servis','Semua work order bengkel',`<button class="btn primary" onclick="go('servis-baru')">+ Servis Baru</button>`)}
const serviceTypes=['Servis berkala','Ganti oli','Rem','Ban','Servis CVT','Rantai & gir','Aki & kelistrikan'];const servicePrices={'Servis berkala':75000,'Ganti oli':25000,'Rem':50000,'Ban':50000,'Servis CVT':120000,'Rantai & gir':60000,'Aki & kelistrikan':50000};
function newService(){selected=[];return shell(`<div class="service-layout"><form class="form-panel" id="woForm" onsubmit="saveOrder(event)"><div class="form-grid"><div class="field"><label>Nama pelanggan</label><input name="name" required placeholder="Nama lengkap"></div><div class="field"><label>No. telepon</label><input name="phone" required placeholder="08xx xxxx xxxx"></div><div class="field"><label>Plat nomor</label><input name="plate" required placeholder="BG 0000 XX"></div><div class="field"><label>Merek / tipe motor</label><input name="motor" required placeholder="Honda Beat"></div><div class="field"><label>Kilometer saat ini</label><input name="km" type="number" min="0" placeholder="0 km"></div><div class="field"><label>Mekanik</label><select name="mechanic" required><option value="">Pilih mekanik</option>${db.mechanics.map(m=>`<option>${esc(m.name)}</option>`).join('')}</select></div><div class="field span2"><label>Keluhan pelanggan</label><textarea name="complaint" placeholder="Jelaskan keluhan motor"></textarea></div><div class="field span2"><label>Layanan</label><div class="service-options">${serviceTypes.map(t=>`<button type="button" class="service-option" data-service="${t}" onclick="toggleService('${t}',this)">${t}</button>`).join('')}</div></div><div class="field"><label>Biaya jasa tambahan (Rp)</label><input name="extraService" type="number" min="0" value="0"></div><div class="field"><label>Biaya suku cadang (Rp)</label><input name="partsCost" type="number" min="0" value="0"></div></div><div class="actions" style="margin-top:18px"><button class="btn primary" type="submit">Simpan Work Order</button><button class="btn" type="button" onclick="go('servis')">Batal</button></div></form><aside class="summary"><h3>Ringkasan Biaya</h3><div class="sumline"><span>Jasa</span><b id="sumService">Rp 0</b></div><div class="sumline"><span>Suku cadang</span><b id="sumParts">Rp 0</b></div><div class="sumline total"><span>Total estimasi</span><b id="sumTotal">Rp 0</b></div><p class="muted" style="font-size:12px">Estimasi akan dihitung otomatis berdasarkan layanan yang dipilih.</p></aside></div>`,'Servis Baru','Buat work order untuk motor masuk')}
function toggleService(t,el){if(selected.includes(t))selected=selected.filter(x=>x!==t);else selected.push(t);el.classList.toggle('selected');calcEstimate()}function calcEstimate(){let svc=selected.reduce((a,t)=>a+servicePrices[t],0)+Number($('[name=extraService]')?.value||0),parts=Number($('[name=partsCost]')?.value||0);['sumService','sumParts','sumTotal'].forEach((id,i)=>$('#'+id).textContent=money(i===0?svc:i===1?parts:svc+parts))}
function saveOrder(e){e.preventDefault();let f=new FormData(e.target),svc=selected.reduce((a,t)=>a+servicePrices[t],0)+Number(f.get('extraService')||0),parts=Number(f.get('partsCost')||0);if(!selected.length){toast('Pilih minimal satu layanan');return}let id='WO-'+String(Math.max(145,...db.orders.map(o=>Number(o.id.slice(3))||0))+1).padStart(4,'0');let o={id,name:f.get('name'),phone:f.get('phone'),plate:f.get('plate').toUpperCase(),motor:f.get('motor'),km:Number(f.get('km')||0),mechanic:f.get('mechanic'),complaint:f.get('complaint'),services:selected.slice(),status:'Menunggu',serviceCost:svc,partsCost:parts,date:new Date().toISOString().slice(0,10)};db.orders.unshift(o);if(!db.customers.some(c=>c.phone===o.phone))db.customers.push({name:o.name,phone:o.phone,address:'-'});save();toast('Work order '+id+' berhasil disimpan');go('servis')}
function pelanggan(){return shell(`<div class="toolbar"><input placeholder="Cari nama / nomor telepon" oninput="query=this.value;render()"><button class="btn primary" onclick="openForm('customer')">+ Pelanggan</button></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Nama pelanggan</th><th>No. telepon</th><th>Alamat</th><th>Total servis</th><th>Aksi</th></tr></thead><tbody>${db.customers.filter(c=>(c.name+c.phone).toLowerCase().includes(query.toLowerCase())).map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.address)}</td><td>${db.orders.filter(o=>o.phone===c.phone).length}</td><td><button class="btn small" onclick="customerDetail('${esc(c.phone)}')">Riwayat</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Data pelanggan kosong</td></tr>'}</tbody></table></div></section>`,'Pelanggan','Data pelanggan bengkel',`<button class="btn primary" onclick="openForm('customer')">+ Pelanggan Baru</button>`)}
function motor(){let map={};db.orders.forEach(o=>{if(!map[o.plate])map[o.plate]=o});return shell(`<section class="panel"><div class="table-wrap"><table><thead><tr><th>Plat nomor</th><th>Pemilik terakhir</th><th>Motor</th><th>KM terakhir</th><th>Terakhir servis</th><th>Riwayat</th></tr></thead><tbody>${Object.values(map).map(o=>`<tr><td><b>${esc(o.plate)}</b></td><td>${esc(o.name)}</td><td>${esc(o.motor)}</td><td>${o.km.toLocaleString('id-ID')} km</td><td>${esc(o.date)}</td><td><button class="btn small" onclick="vehicleHistory('${o.plate}')">Lihat</button></td></tr>`).join('')}</tbody></table></div></section>`,'Data Motor','Daftar kendaraan yang pernah diservis')}
function suku(){return shell(`<div class="toolbar"><input placeholder="Cari nama / kode suku cadang" oninput="query=this.value;render()"><button class="btn primary" onclick="openForm('part')">+ Tambah Suku Cadang</button></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama suku cadang</th><th>Stok</th><th>Stok minimum</th><th>Harga satuan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${db.parts.filter(p=>(p.name+p.sku).toLowerCase().includes(query.toLowerCase())).map(p=>`<tr><td>${esc(p.sku)}</td><td><b>${esc(p.name)}</b></td><td>${p.stock}</td><td>${p.min}</td><td>${money(p.price)}</td><td>${p.stock<=p.min?'<span class="status s-menunggu">Menipis</span>':'<span class="status s-selesai">Aman</span>'}</td><td><button class="btn small" onclick="adjustStock('${p.sku}')">Ubah stok</button></td></tr>`).join('')}</tbody></table></div></section>`,'Suku Cadang','Kelola persediaan dan harga suku cadang',`<button class="btn primary" onclick="openForm('part')">+ Tambah Suku Cadang</button>`)}
function mekanik(){return shell(`<div class="toolbar"><button class="btn primary" onclick="openForm('mechanic')">+ Tambah Mekanik</button></div><div class="cards">${db.mechanics.map(m=>`<article class="mini-card"><h4>${esc(m.name)}</h4><p>${esc(m.specialty)}</p><p>${esc(m.phone)}</p><span class="pill">${esc(m.status)}</span></article>`).join('')}</div>`,'Mekanik','Data mekanik dan keahlian')}
function invoice(){return shell(`<section class="panel"><div class="table-wrap"><table><thead><tr><th>No. Invoice</th><th>No. WO</th><th>Pelanggan</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${db.invoices.map(i=>`<tr><td><b>${i.id}</b></td><td>${i.wo}</td><td>${esc(i.name)}</td><td>${money(i.total)}</td><td>${i.status==='Lunas'?'<span class="status s-selesai">Lunas</span>':'<span class="status s-menunggu">Belum lunas</span>'}</td><td><button class="btn small" onclick="toggleInvoice('${i.id}')">${i.status==='Lunas'?'Batalkan lunas':'Tandai lunas'}</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Invoice belum tersedia. Buat dari detail work order.</td></tr>'}</tbody></table></div></section>`,'Invoice','Tagihan dan pembayaran pelanggan')}
function laporan(){let revenue=db.invoices.filter(i=>i.status==='Lunas').reduce((a,i)=>a+i.total,0),orders=db.orders.length,done=db.orders.filter(o=>o.status==='Selesai').length;return shell(`<div class="grid stats"><div class="stat"><div class="label">Total Work Order</div><strong>${orders}</strong></div><div class="stat"><div class="label">Servis Selesai</div><strong>${done}</strong></div><div class="stat"><div class="label">Pendapatan lunas</div><strong style="font-size:23px">${money(revenue)}</strong></div><div class="stat"><div class="label">Mekanik aktif</div><strong>${db.mechanics.filter(m=>m.status==='Aktif').length}</strong></div></div><section class="panel"><h3>Ringkasan status work order</h3>${['Menunggu','Dikerjakan','Siap diambil','Selesai'].map(s=>{let n=db.orders.filter(o=>o.status===s).length,p=db.orders.length?Math.round(n/db.orders.length*100):0;return `<div style="margin:15px 0"><div class="sumline"><b>${s}</b><span>${n} (${p}%)</span></div><div class="progress"><span style="width:${p}%"></span></div></div>`}).join('')}<button class="btn" onclick="exportCSV('orders')">Ekspor data servis</button> <button class="btn" onclick="exportCSV('invoices')">Ekspor invoice</button></section>`,'Laporan','Ringkasan operasional bengkel')}
function render(){let root=$('#root');if(!user){auth();return}let views={dashboard,servis,'servis-baru':newService,pelanggan,motor,suku,mekanik,invoice,laporan};root.innerHTML=(views[page]||dashboard)();if(page==='servis-baru'){document.querySelectorAll('[name=extraService],[name=partsCost]').forEach(x=>x.addEventListener('input',calcEstimate))}}
function go(p){page=p;query='';render()}function logout(){sessionStorage.removeItem('bmj_user');user=null;page='dashboard';auth();toast('Anda telah keluar')}
function auth(mode='login'){let root=$('#root');root.innerHTML=`<div class="auth-screen"><form class="auth-card" onsubmit="authSubmit(event,'${mode}')"><div class="auth-brand">Bengkel Motor<br>Maju Jaya</div><div class="muted">Sistem Manajemen Bengkel</div><h1>${mode==='login'?'Masuk ke akun':'Buat akun baru'}</h1><p class="muted">${mode==='login'?'Kelola operasional bengkel dengan mudah.':'Daftarkan akun untuk mulai menggunakan sistem.'}</p>${mode==='register'?'<div class="field"><label>Nama lengkap</label><input name="name" required placeholder="Nama pengguna"></div>':''}<div class="field"><label>Email</label><input type="email" name="email" required placeholder="nama@email.com"></div><div class="field"><label>Password</label><input type="password" name="password" required minlength="6" placeholder="Minimal 6 karakter"></div>${mode==='register'?'<div class="field"><label>Konfirmasi password</label><input type="password" name="confirm" required minlength="6" placeholder="Ulangi password"></div>':''}<button class="btn primary" type="submit">${mode==='login'?'Masuk':'Daftar akun'}</button><div class="auth-foot">${mode==='login'?'Belum punya akun?':'Sudah punya akun?'} <span class="link" onclick="auth('${mode==='login'?'register':'login'}')">${mode==='login'?'Daftar sekarang':'Masuk'}</span></div><div class="auth-note">Akun dan data demo disimpan di browser perangkat ini. Untuk penggunaan publik/multi-pengguna, hubungkan aplikasi ke backend dan database.</div></form></div>`}
function authSubmit(e,mode){e.preventDefault();let f=new FormData(e.target),email=f.get('email').toLowerCase(),password=f.get('password');if(mode==='register'){if(password!==f.get('confirm')){toast('Konfirmasi password tidak sama');return}if(db.users.some(u=>u.email===email)){toast('Email sudah terdaftar');return}db.users.push({name:f.get('name'),email,password});save();toast('Registrasi berhasil, silakan masuk');auth('login')}else{let u=db.users.find(u=>u.email===email&&u.password===password);if(!u){toast('Email atau password salah');return}user={name:u.name,email:u.email};sessionStorage.setItem('bmj_user',JSON.stringify(user));render()}}
function modal(html){let m=document.createElement('div');m.className='modal-back';m.id='modal';m.innerHTML=`<div class="modal">${html}</div>`;m.addEventListener('click',e=>{if(e.target===m)m.remove()});document.body.append(m)}function closeModal(){$('#modal')?.remove()}
function detailOrder(id){let o=db.orders.find(x=>x.id===id);modal(`<div class="modal-head"><h2>Detail Work Order ${o.id}</h2><button class="close" onclick="closeModal()">×</button></div><div class="grid" style="grid-template-columns:1fr 1fr;gap:12px"><div><span class="muted">Pelanggan</span><br><b>${esc(o.name)}</b></div><div><span class="muted">Telepon</span><br><b>${esc(o.phone)}</b></div><div><span class="muted">Plat nomor</span><br><b>${esc(o.plate)}</b></div><div><span class="muted">Motor</span><br><b>${esc(o.motor)}</b></div><div><span class="muted">Mekanik</span><br><b>${esc(o.mechanic)}</b></div><div><span class="muted">Status</span><br>${statusTag(o.status)}</div></div><p><b>Keluhan:</b> ${esc(o.complaint||'-')}</p><p><b>Layanan:</b> ${esc(o.services.join(', '))}</p><div class="sumline"><span>Jasa</span><b>${money(o.serviceCost)}</b></div><div class="sumline"><span>Suku cadang</span><b>${money(o.partsCost)}</b></div><div class="sumline total"><span>Total</span><b>${money(o.serviceCost+o.partsCost)}</b></div><div class="field" style="margin-top:15px"><label>Ubah status</label><select id="newStatus">${['Menunggu','Dikerjakan','Siap diambil','Selesai'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="updateStatus('${o.id}')">Simpan status</button><button class="btn" onclick="createInvoice('${o.id}')">Buat invoice</button></div>`)}
function updateStatus(id){db.orders.find(o=>o.id===id).status=$('#newStatus').value;save();closeModal();render();toast('Status work order diperbarui')}function createInvoice(id){let o=db.orders.find(x=>x.id===id);if(db.invoices.some(i=>i.wo===id)){toast('Invoice untuk WO ini sudah ada');return}db.invoices.unshift({id:'INV-'+String(db.invoices.length+1).padStart(4,'0'),wo:id,name:o.name,total:o.serviceCost+o.partsCost,status:'Belum lunas'});save();closeModal();go('invoice');toast('Invoice berhasil dibuat')}function toggleInvoice(id){let i=db.invoices.find(x=>x.id===id);i.status=i.status==='Lunas'?'Belum lunas':'Lunas';save();render()}
function openForm(type){let cfg={customer:['Tambah Pelanggan',[['name','Nama pelanggan'],['phone','No. telepon'],['address','Alamat']]],part:['Tambah Suku Cadang',[['name','Nama suku cadang'],['sku','Kode barang'],['stock','Stok'],['min','Stok minimum'],['price','Harga satuan']]],mechanic:['Tambah Mekanik',[['name','Nama mekanik'],['phone','No. telepon'],['specialty','Keahlian']]]}[type];modal(`<div class="modal-head"><h2>${cfg[0]}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="addRecord(event,'${type}')">${cfg[1].map(([n,l])=>`<div class="field" style="margin:12px 0"><label>${l}</label><input name="${n}" ${['stock','min','price'].includes(n)?'type="number" min="0"':''} required></div>`).join('')}<button class="btn primary" style="margin-top:10px">Simpan</button></form>`)}function addRecord(e,type){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(type==='customer')db.customers.push(o);if(type==='mechanic')db.mechanics.push({...o,status:'Aktif'});if(type==='part')db.parts.push({...o,stock:+o.stock,min:+o.min,price:+o.price});save();closeModal();render();toast('Data berhasil ditambahkan')}
function adjustStock(sku){let p=db.parts.find(x=>x.sku===sku),v=prompt('Masukkan jumlah stok baru untuk '+p.name,p.stock);if(v!==null&&v!==''&&!isNaN(v)&&Number(v)>=0){p.stock=Number(v);save();render();toast('Stok diperbarui')}}function customerDetail(phone){let c=db.customers.find(x=>x.phone===phone),rows=db.orders.filter(o=>o.phone===phone);modal(`<div class="modal-head"><h2>Riwayat Pelanggan</h2><button class="close" onclick="closeModal()">×</button></div><h3>${esc(c.name)}</h3><p>${esc(c.phone)} · ${esc(c.address)}</p>${tableOrders(rows)}`)}function vehicleHistory(plate){let rows=db.orders.filter(o=>o.plate===plate);modal(`<div class="modal-head"><h2>Riwayat ${esc(plate)}</h2><button class="close" onclick="closeModal()">×</button></div>${tableOrders(rows)}`)}
function exportCSV(type){let rows=type==='orders'?db.orders:db.invoices;if(!rows.length){toast('Tidak ada data untuk diekspor');return}let keys=Object.keys(rows[0]),csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(Array.isArray(r[k])?r[k].join('; '):r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=type+'-bengkel-maju-jaya.csv';a.click();URL.revokeObjectURL(a.href);toast('File CSV berhasil diekspor')}
render();
</script></body></html>
